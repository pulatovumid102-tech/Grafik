<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umatizim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f0f3ee; --bg2: #ffffff; --bg3: #e2e8de;
    --accent: #558237; --accent2: #a4b83f; --dark: #1e5927;
    --light: #a9b7a3; --text: #1e2e1a; --text2: #558237; --text3: #7a9669;
    --danger: #c0392b; --warn: #AA7B08; --radius: 14px; --radius-sm: 8px;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding-bottom: 40px; }
  .header { background: var(--bg2); padding: 16px 20px; border-bottom: 1px solid var(--bg3); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .back-btn { width: 32px; height: 32px; background: var(--bg3); border: none; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .logo { width: 36px; height: 36px; background: var(--dark); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .header-title { font-size: 17px; font-weight: 600; color: var(--dark); }
  .header-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }
  .btn-add { width: 36px; height: 36px; background: var(--accent); border: none; border-radius: 10px; color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .breadcrumb { padding: 10px 16px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text3); overflow-x: auto; white-space: nowrap; background: var(--bg2); border-bottom: 1px solid var(--bg3); }
  .breadcrumb span { cursor: pointer; }
  .breadcrumb span:hover { color: var(--accent); }
  .main { padding: 20px 16px; }
  .page-title { font-size: 13px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; font-weight: 500; }
  .card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 10px; transition: opacity 0.15s; }
  .card:active { opacity: 0.8; }
  .card-icon { width: 44px; height: 44px; background: var(--bg3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .card-info { flex: 1; }
  .card-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .card-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .card-arrow { color: var(--light); font-size: 20px; }
  .day-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 10px; transition: opacity 0.15s; }
  .day-card:active { opacity: 0.8; }
  .day-card.warn-red { border-color: var(--danger); background: #fdf2f2; }
  .day-card.past { background: #fdf2f2; border-color: #f0c0c0; }
  .day-date { width: 44px; text-align: center; flex-shrink: 0; }
  .day-date-num { font-size: 20px; font-weight: 600; color: var(--dark); line-height: 1; }
  .day-date-num.past { color: var(--danger); }
  .day-date-month { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .day-divider { width: 1px; height: 36px; background: var(--bg3); flex-shrink: 0; }
  .day-info { flex: 1; }
  .day-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .day-name.past { color: var(--danger); }
  .day-meals { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .day-warn { font-size: 11px; color: var(--danger); margin-top: 2px; }
  .today-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent); color: white; font-weight: 500; flex-shrink: 0; }
  .past-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #fdecea; color: var(--danger); font-weight: 500; flex-shrink: 0; }
  .meal-row { background: var(--bg2); border-bottom: 1px solid var(--bg3); padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: opacity 0.15s; }
  .meal-row:active { opacity: 0.8; }
  .meal-row-icon { font-size: 22px; flex-shrink: 0; }
  .meal-row-info { flex: 1; }
  .meal-row-time { font-size: 12px; color: var(--text3); font-weight: 500; }
  .meal-row-name { font-size: 15px; font-weight: 500; color: var(--text); margin-top: 1px; }
  .meal-row-items { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .meal-row-missing { font-size: 12px; color: var(--danger); margin-top: 2px; }
  .meal-row-arrow { color: var(--light); font-size: 18px; }
  .zapas-item { background: var(--bg2); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .zapas-icon { font-size: 28px; flex-shrink: 0; }
  .zapas-info { flex: 1; }
  .zapas-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .zapas-raw { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .zapas-date { font-size: 11px; color: var(--light); margin-top: 2px; }
  .zapas-right { text-align: right; flex-shrink: 0; }
  .zapas-days { font-size: 20px; font-weight: 600; }
  .zapas-days-lbl { font-size: 11px; color: var(--text3); }
  .status-green { color: var(--accent); }
  .status-warn { color: var(--warn); }
  .status-red { color: var(--danger); }
  .progress-bar { height: 4px; background: var(--bg3); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; }
  .ovqat-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .ovqat-icon { width: 44px; height: 44px; background: var(--bg3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .ovqat-info { flex: 1; }
  .ovqat-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .ovqat-items { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .btn-sm { width: 30px; height: 30px; border: 1px solid var(--bg3); background: var(--bg3); border-radius: var(--radius-sm); color: var(--text3); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border-radius: var(--radius) var(--radius) 0 0; padding: 20px 20px 40px; width: 100%; max-width: 500px; border-top: 2px solid var(--accent2); max-height: 85vh; overflow-y: auto; }
  .modal-handle { width: 36px; height: 4px; background: var(--bg3); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 16px; }
  .search-input { width: 100%; background: var(--bg); border: 1px solid var(--bg3); border-radius: var(--radius-sm); padding: 10px 14px; color: var(--text); font-size: 15px; outline: none; margin-bottom: 12px; }
  .search-input:focus { border-color: var(--accent); }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 13px; color: var(--text3); margin-bottom: 6px; display: block; font-weight: 500; }
  .form-input { width: 100%; background: var(--bg); border: 1px solid var(--bg3); border-radius: var(--radius-sm); padding: 12px 14px; color: var(--text); font-size: 15px; outline: none; }
  .form-input:focus { border-color: var(--accent); }
  .amount-row { display: flex; align-items: center; gap: 10px; }
  .amount-input { flex: 1; background: var(--bg); border: 1px solid var(--bg3); border-radius: var(--radius-sm); padding: 12px 14px; color: var(--text); font-size: 20px; font-weight: 600; outline: none; text-align: center; }
  .amount-input:focus { border-color: var(--accent); }
  .unit-lbl { font-size: 15px; color: var(--text3); min-width: 30px; }
  .coef-info { font-size: 13px; color: var(--text3); margin-top: 8px; padding: 8px 12px; background: var(--bg); border-radius: var(--radius-sm); }
  .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
  .btn-cancel { flex: 1; padding: 14px; background: var(--bg3); border: none; border-radius: var(--radius-sm); color: var(--text3); font-size: 15px; cursor: pointer; }
  .btn-save { flex: 2; padding: 14px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-danger-full { flex: 1; padding: 14px; background: #fdecea; border: none; border-radius: var(--radius-sm); color: var(--danger); font-size: 15px; font-weight: 600; cursor: pointer; }
  .product-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
  .product-btn { background: var(--bg); border: 1px solid var(--bg3); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; width: 100%; }
  .product-btn:active { background: var(--bg3); }
  .product-btn.selected { border-color: var(--accent); background: #e8f0e0; }
  .product-btn-icon { font-size: 22px; }
  .product-btn-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .product-btn-unit { font-size: 12px; color: var(--text3); }
  .amount-section { display: none; border-top: 1px solid var(--bg3); margin-top: 12px; padding-top: 14px; }
  .amount-section.show { display: block; }
  .ing-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ing-name { flex: 1; font-size: 14px; color: var(--text); }
  .ing-amount { font-size: 13px; color: var(--text3); background: var(--bg3); padding: 3px 10px; border-radius: 20px; }
  .ing-del { width: 24px; height: 24px; border: none; background: none; color: var(--light); font-size: 16px; cursor: pointer; }
  .meal-option { background: var(--bg); border: 1px solid var(--bg3); border-radius: var(--radius-sm); padding: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 8px; }
  .meal-option:active { background: var(--bg3); }
  .meal-option.selected { border-color: var(--accent); background: #e8f0e0; }
  .meal-option-icon { font-size: 24px; }
  .meal-option-name { font-size: 15px; font-weight: 500; color: var(--text); flex: 1; }
  .meal-option-items { font-size: 12px; color: var(--text3); }
  .confirm-box { background: #e8f0e0; border-radius: var(--radius-sm); padding: 14px; margin-bottom: 16px; font-size: 14px; color: var(--dark); text-align: center; border: 1px solid var(--accent2); }
  .coef-badge { font-size: 11px; background: #e8f0e0; color: var(--accent); padding: 2px 8px; border-radius: 20px; margin-left: 6px; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; margin-bottom: 6px; color: var(--text2); }
  .empty-sub { font-size: 13px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 500; z-index: 300; transition: transform 0.25s; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app"></div>

<div class="modal-overlay" id="modal-zadd">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Mahsulot qo'shish</div>
    <input class="search-input" id="zadd-search" placeholder="🔍 Qidirish...">
    <div class="product-list" id="zadd-list"></div>
    <div class="amount-section" id="zadd-amount">
      <label class="form-label" id="zadd-label">Miqdor</label>
      <div class="amount-row">
        <input class="amount-input" id="zadd-input" type="number" placeholder="0" min="0">
        <span class="unit-lbl" id="zadd-unit">g</span>
      </div>
      <div class="coef-info" id="zadd-coef" style="display:none"></div>
      <div class="modal-btns">
        <button class="btn-cancel" id="zadd-cancel">Bekor</button>
        <button class="btn-save" id="zadd-save">Qo'shish</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-zedit">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="zedit-title">Yangilash</div>
    <label class="form-label" id="zedit-label">Miqdor</label>
    <div class="amount-row">
      <input class="amount-input" id="zedit-input" type="number" placeholder="0" min="0">
      <span class="unit-lbl" id="zedit-unit">g</span>
    </div>
    <div class="coef-info" id="zedit-coef" style="display:none;margin-top:8px"></div>
    <div class="modal-btns" style="margin-top:16px">
      <button class="btn-danger-full" id="zedit-del">O'chirish</button>
      <button class="btn-cancel" id="zedit-cancel">Bekor</button>
      <button class="btn-save" id="zedit-save">Saqlash</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-meal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="meal-modal-title">Ovqat tanlash</div>
    <div class="confirm-box" id="meal-confirm-box" style="display:none"></div>
    <div id="meal-options"></div>
    <div class="modal-btns">
      <button class="btn-cancel" id="meal-cancel">Bekor</button>
      <button class="btn-save" id="meal-confirm-yes" style="display:none">Ha, o'zgartirish</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-ovqat">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="ovqat-modal-title">Yangi ovqat</div>
    <div class="form-group">
      <label class="form-label">Nomi</label>
      <input class="form-input" id="ovqat-name" type="text" placeholder="Masalan: Sho'rva" maxlength="30">
    </div>
    <div class="form-group">
      <label class="form-label">Belgi</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;" id="ovqat-emoji-grid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Tarkibi (xom miqdorda kiriting)</label>
      <div id="ovqat-ings"></div>
      <button class="product-btn" id="ovqat-add-ing" style="margin-top:8px">
        <span class="product-btn-icon">➕</span>
        <span class="product-btn-name">Mahsulot qo'shish</span>
      </button>
    </div>
    <div class="modal-btns">
      <button class="btn-danger-full" id="ovqat-del" style="display:none">O'chirish</button>
      <button class="btn-cancel" id="ovqat-cancel">Bekor</button>
      <button class="btn-save" id="ovqat-save">Saqlash</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-ing">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Mahsulot tanlash</div>
    <input class="search-input" id="ing-search" placeholder="🔍 Qidirish...">
    <div class="product-list" id="ing-list"></div>
    <div class="amount-section" id="ing-amount">
      <label class="form-label" id="ing-label">Miqdor (xom)</label>
      <div class="amount-row">
        <input class="amount-input" id="ing-input" type="number" placeholder="0" min="0">
        <span class="unit-lbl" id="ing-unit">g</span>
      </div>
      <div class="coef-info" id="ing-coef-info" style="display:none;margin-top:8px"></div>
      <div class="modal-btns">
        <button class="btn-cancel" id="ing-cancel">Bekor</button>
        <button class="btn-save" id="ing-save">Qo'shish</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var UZ_DAYS = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
var UZ_MONTHS = ['Yan','Fev','Mar','Apr','May','Iyun','Iyul','Avg','Sen','Okt','Noy','Dek'];

var MEAL_TIMES = [
  { key: 'nonushta', icon: '🌅', name: 'Nonushta' },
  { key: 'snack',    icon: '🍎', name: 'Perекус' },
  { key: 'obed',     icon: '☀️', name: 'Tushlik' },
  { key: 'ujin',     icon: '🌙', name: 'Kechki ovqat' },
  { key: 'kechga',   icon: '🌛', name: 'Kechga' }
];

var DEFAULT_PRODUCTS = [
  { id: 'tovuq',    name: 'Tovuq',    icon: '🥩', unit: 'g',  coef: 0.72, coefLabel: '100g xom → 72g pishgan',  dailyCooked: 440 },
  { id: 'tuxum',    name: 'Tuxum',    icon: '🥚', unit: 'ta', coef: 1,    coefLabel: null, dailyRaw: 5 },
  { id: 'tvorog',   name: 'Tvorog',   icon: '🥛', unit: 'ta', coef: 1,    coefLabel: null, dailyRaw: 1 },
  { id: 'guruch',   name: 'Guruch',   icon: '🌾', unit: 'g',  coef: 2.14, coefLabel: '100g xom → 214g pishgan', dailyCooked: 500 },
  { id: 'grechka',  name: 'Grechka',  icon: '🌾', unit: 'g',  coef: 2.5,  coefLabel: '100g xom → 250g pishgan', dailyCooked: 600 },
  { id: 'brokoli',  name: 'Brokoli',  icon: '🥦', unit: 'ta', coef: 1,    coefLabel: null, dailyRaw: 2 },
  { id: 'olma',     name: 'Olma',     icon: '🍎', unit: 'ta', coef: 1,    coefLabel: null, dailyRaw: 1 },
  { id: 'banan',    name: 'Banan',    icon: '🍌', unit: 'ta', coef: 1,    coefLabel: null, dailyRaw: 1 },
  { id: 'ovsyanka', name: 'Ovsyanka', icon: '🥣', unit: 'g',  coef: 1,    coefLabel: null, dailyRaw: 100 },
];

// Olma default ovqat
var DEFAULT_OVQATLAR = [
  { id: 'klassika',   name: 'Klassika', icon: '🍱', ingredients: [
    { productId: 'tovuq', rawAmount: 305, cookedAmount: 220 },
    { productId: 'guruch', rawAmount: 117, cookedAmount: 250 },
    { productId: 'brokoli', rawAmount: 1, cookedAmount: 1 }
  ]},
  { id: 'tuxum_meal', name: 'Tuxum',  icon: '🍳', ingredients: [{ productId: 'tuxum', rawAmount: 5, cookedAmount: 5 }] },
  { id: 'tvorog_meal',name: 'Tvorog', icon: '🥛', ingredients: [{ productId: 'tvorog', rawAmount: 1, cookedAmount: 1 }] },
  { id: 'olma_meal',  name: 'Olma',   icon: '🍎', ingredients: [{ productId: 'olma', rawAmount: 2, cookedAmount: 2 }] },
];

var DEFAULT_DAY_PLAN = {
  nonushta: 'tuxum_meal',
  snack: 'olma_meal',
  obed: 'klassika',
  ujin: 'klassika',
  kechga: 'tvorog_meal'
};

var pageStack = ['home'];
var selectedDate = null;
var zapas = [];
var ovqatlar = [];
var dayPlans = {};
var selectedZapasProduct = null;
var editingZapasIdx = null;
var editingMealTime = null;
var pendingMealChange = null;
var editingOvqatId = null;
var tempIngredients = [];
var ingSelectedProduct = null;

function loadData() {
  try {
    var d = localStorage.getItem('umatizim_v6');
    if (d) { var p = JSON.parse(d); zapas = p.zapas||[]; ovqatlar = p.ovqatlar||[]; dayPlans = p.dayPlans||{}; }
    if (!ovqatlar.length) ovqatlar = JSON.parse(JSON.stringify(DEFAULT_OVQATLAR));
  } catch(e) { zapas = []; ovqatlar = JSON.parse(JSON.stringify(DEFAULT_OVQATLAR)); dayPlans = {}; }
}
function saveData() { localStorage.setItem('umatizim_v6', JSON.stringify({ zapas: zapas, ovqatlar: ovqatlar, dayPlans: dayPlans })); }
function dateStr(d) { return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function fmtDate(d) { return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2); }
function getDayPlan(d) { return dayPlans[dateStr(d)] || JSON.parse(JSON.stringify(DEFAULT_DAY_PLAN)); }

function getDays() {
  var days = [];
  var t = new Date(); t.setHours(0,0,0,0);
  var yest = new Date(t); yest.setDate(t.getDate()-1);
  days.push(yest);
  for (var i = 0; i < 7; i++) { var d = new Date(t); d.setDate(t.getDate()+i); days.push(d); }
  return days;
}

function isToday(d) { var t = new Date(); t.setHours(0,0,0,0); return d.getTime()===t.getTime(); }
function isYesterday(d) { var t = new Date(); t.setHours(0,0,0,0); var y = new Date(t); y.setDate(t.getDate()-1); return d.getTime()===y.getTime(); }
function isPast(d) { var t = new Date(); t.setHours(0,0,0,0); return d.getTime() < t.getTime(); }
function getOvqat(id) { if(!id) return null; return ovqatlar.find(function(o){return o.id===id;})||null; }
function getProd(id) { return DEFAULT_PRODUCTS.find(function(p){return p.id===id;})||null; }

// Get raw amount needed for one serving of an ingredient
function getRawNeeded(ing) {
  // New format: rawAmount stored directly
  if (ing.rawAmount !== undefined) return ing.rawAmount;
  // Legacy format: amount = cooked, convert to raw
  var prod = getProd(ing.productId);
  if (!prod) return ing.amount || 0;
  return prod.coef !== 1 ? (ing.amount / prod.coef) : ing.amount;
}

// Get cooked amount for display
function getCookedAmount(ing) {
  if (ing.cookedAmount !== undefined) return ing.cookedAmount;
  var prod = getProd(ing.productId);
  if (!prod) return ing.amount || 0;
  return prod.coef !== 1 ? Math.round(ing.rawAmount * prod.coef) : ing.rawAmount;
}

// Cumulative remaining for a product up to dayIndex (0-based in allDays)
// entryDate aware: only start consuming from entryDate
function calcRemainingForDay(productId, dayIndex, allDays) {
  var zapItem = zapas.find(function(z){return z.productId===productId;});
  if (!zapItem) return 0;
  var available = zapItem.rawAmount;
  var entryDate = zapItem.entryDate ? new Date(zapItem.entryDate) : null;
  entryDate && entryDate.setHours(0,0,0,0);

  for (var i = 0; i < dayIndex; i++) {
    var d = allDays[i];
    // only consume if day >= entryDate
    if (entryDate && d < entryDate) continue;
    var plan = getDayPlan(d);
    MEAL_TIMES.forEach(function(mt) {
      var ovqat = getOvqat(plan[mt.key]);
      if (!ovqat) return;
      ovqat.ingredients.forEach(function(ing) {
        if (ing.productId === productId) {
          available -= getRawNeeded(ing);
        }
      });
    });
  }
  return available;
}

function dayHasMissing(d, dayIndex, allDays) {
  if (isPast(d)) return false; // don't warn for past days
  var plan = getDayPlan(d);
  for (var i = 0; i < MEAL_TIMES.length; i++) {
    var ovqat = getOvqat(plan[MEAL_TIMES[i].key]);
    if (!ovqat) continue;
    for (var j = 0; j < ovqat.ingredients.length; j++) {
      var ing = ovqat.ingredients[j];
      var remaining = calcRemainingForDay(ing.productId, dayIndex, allDays);
      if (remaining < getRawNeeded(ing)) return true;
    }
  }
  return false;
}

function getMissingForMeal(ovqatId, dayIndex, allDays) {
  var ovqat = getOvqat(ovqatId); if(!ovqat) return [];
  var missing = [];
  ovqat.ingredients.forEach(function(ing) {
    var remaining = calcRemainingForDay(ing.productId, dayIndex, allDays);
    if (remaining < getRawNeeded(ing)) {
      var prod = getProd(ing.productId);
      if (prod) missing.push(prod.name);
    }
  });
  return missing;
}

// Effective remaining for zapas display (subtract all days from entryDate to today)
function calcEffectiveRemaining(item) {
  var prod = getProd(item.productId); if(!prod) return item.rawAmount;
  if (!item.entryDate) return item.rawAmount;
  var entry = new Date(item.entryDate); entry.setHours(0,0,0,0);
  var today = new Date(); today.setHours(0,0,0,0);
  var remaining = item.rawAmount;
  var cur = new Date(entry);
  while (cur < today) {
    var plan = getDayPlan(cur);
    MEAL_TIMES.forEach(function(mt) {
      var ovqat = getOvqat(plan[mt.key]);
      if (!ovqat) return;
      ovqat.ingredients.forEach(function(ing) {
        if (ing.productId === item.productId) remaining -= getRawNeeded(ing);
      });
    });
    cur.setDate(cur.getDate()+1);
  }
  return Math.max(0, Math.round(remaining*10)/10);
}

function calcDaysLeft(item) {
  var prod = getProd(item.productId); if(!prod) return 0;
  var effective = calcEffectiveRemaining(item);
  var daily = prod.dailyRaw ? prod.dailyRaw : (prod.dailyCooked/prod.coef);
  return Math.round((effective/daily)*10)/10;
}

function statusClass(d){return d>=3?'status-green':d>=1?'status-warn':'status-red';}
function statusColor(d){return d>=3?'#558237':d>=1?'#AA7B08':'#c0392b';}

// =================== RENDER ===================
function render() {
  var page = pageStack[pageStack.length-1];
  var app = document.getElementById('app');
  if (page==='home') renderHome(app);
  else if (page==='soglik') renderSoglik(app);
  else if (page==='ovqatlanish') renderOvqatlanish(app);
  else if (page==='ratsion') renderRatsion(app);
  else if (page==='day') renderDay(app);
  else if (page==='zapas') renderZapas(app);
  else if (page==='harid') renderHarid(app);
  else if (page==='ovqatlar') renderOvqatlar(app);
}

function renderRatsion(app){
  var allDays = getDays();
  var h = mkH('📋 Kunlik ratsion',true,null)+mkBc()+'<div class="main"><div class="page-title">Kunlar</div>';
  for (var i=0; i<allDays.length; i++) {
    var d=allDays[i]; var tod=isToday(d); var yest=isYesterday(d); var past=isPast(d);
    var miss=dayHasMissing(d,i,allDays);
    var plan=getDayPlan(d);
    var mealNames=MEAL_TIMES.map(function(mt){var o=getOvqat(plan[mt.key]);return o?o.name:null;}).filter(Boolean);
    var cardClass='day-card'+(past?' past':(miss?' warn-red':''));
    h+='<div class="'+cardClass+'" data-ts="'+d.getTime()+'">';
    h+='<div class="day-date"><div class="day-date-num'+(past?' past':'')+'">'+d.getDate()+'</div>';
    h+='<div class="day-date-month">'+UZ_MONTHS[d.getMonth()]+'</div></div>';
    h+='<div class="day-divider"></div>';
    h+='<div class="day-info"><div class="day-name'+(past?' past':'')+'">'+UZ_DAYS[d.getDay()]+'</div>';
    h+='<div class="day-meals">'+mealNames.join(' / ')+'</div>';
    if (!past&&miss) h+='<div class="day-warn">⚠️ Mahsulot yetmaydi</div>';
    h+='</div>';
    if (tod) h+='<span class="today-badge">Bugun</span>';
    else if (yest) h+='<span class="past-badge">Kecha</span>';
    h+='<span class="card-arrow">›</span></div>';
  }
  h+='</div>';
  app.innerHTML=h; bc();
  document.querySelectorAll('.day-card').forEach(function(c){
    c.addEventListener('click',function(){selectedDate=new Date(parseInt(this.getAttribute('data-ts')));pageStack.push('day');render();});
  });
}

function renderDay(app){
  var d=selectedDate;
  var title=fmtDate(d)+' '+UZ_DAYS[d.getDay()];
  var plan=getDayPlan(d);
  var allDays=getDays();
  var dayIndex=allDays.findIndex(function(dd){return dateStr(dd)===dateStr(d);});
  if(dayIndex<0) dayIndex=1; // default to today index
  var h=mkH(title,true,null)+mkBc()+'<div style="margin-bottom:16px">';
  MEAL_TIMES.forEach(function(mt){
    var ovqatId=plan[mt.key];
    var ovqat=getOvqat(ovqatId);
    var missing=ovqat?getMissingForMeal(ovqatId,dayIndex,allDays):[];
    var itemsStr=ovqat?ovqat.ingredients.map(function(ing){
      var p=getProd(ing.productId); if(!p) return '';
      var cooked=getCookedAmount(ing);
      var raw=getRawNeeded(ing);
      if(p.coef!==1) return p.name+' '+cooked+p.unit+' <span style="opacity:0.6;font-size:11px">('+raw+'g xom)</span>';
      return p.name+' '+cooked+p.unit;
    }).join(', '):'—';
    h+='<div class="meal-row" data-time="'+mt.key+'">';
    h+='<div class="meal-row-icon">'+mt.icon+'</div>';
    h+='<div class="meal-row-info">';
    h+='<div class="meal-row-time">'+mt.name+'</div>';
    h+='<div class="meal-row-name">'+(ovqat?ovqat.icon+' '+ovqat.name:'Tanlanmagan')+'</div>';
    if(missing.length) h+='<div class="meal-row-missing">⚠️ Yo\'q: '+missing.join(', ')+'</div>';
    else if(ovqat) h+='<div class="meal-row-items">'+itemsStr+'</div>';
    h+='</div><span class="meal-row-arrow">›</span></div>';
  });
  h+='</div>';
  app.innerHTML=h; bc();
  document.querySelectorAll('.meal-row').forEach(function(row){
    row.addEventListener('click',function(){openMealSelect(dateStr(d),this.getAttribute('data-time'),plan[this.getAttribute('data-time')]);});
  });
}

function renderZapas(app){
  var h=mkH('📦 Zapas',true,'zadd-btn')+mkBc()+'<div class="main"><div class="page-title">Mahsulotlar</div>';
  if(!zapas.length){
    h+='<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">Hali mahsulot yo\'q</div><div class="empty-sub">+ tugmasini bosib qo\'shing</div></div>';
  } else {
    zapas.forEach(function(item,i){
      var prod=getProd(item.productId); if(!prod) return;
      var effective=calcEffectiveRemaining(item);
      var days=calcDaysLeft(item);
      var sc=statusClass(days); var clr=statusColor(days);
      var pct=Math.min(100,Math.round((days/7)*100));
      var cooked=prod.coef!==1?' → '+Math.round(effective*prod.coef)+prod.unit+' pishgan':'';
      var dateLabel=item.entryDate?fmtDate(new Date(item.entryDate))+' da kiritilgan':'';
      h+='<div class="zapas-item" data-idx="'+i+'">';
      h+='<div class="zapas-icon">'+prod.icon+'</div>';
      h+='<div class="zapas-info"><div class="zapas-name">'+prod.name+'</div>';
      h+='<div class="zapas-raw">'+effective+prod.unit+' qoldi'+cooked+'</div>';
      if(dateLabel) h+='<div class="zapas-date">'+dateLabel+'</div>';
      h+='<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+clr+'"></div></div></div>';
      h+='<div class="zapas-right"><div class="zapas-days '+sc+'">'+days+'</div><div class="zapas-days-lbl">kun</div></div></div>';
    });
  }
  h+='</div>';
  app.innerHTML=h; bc();
  var ab=document.getElementById('zadd-btn');
  if(ab) ab.addEventListener('click',openZaddModal);
  document.querySelectorAll('.zapas-item').forEach(function(el){
    el.addEventListener('click',function(){openZeditModal(parseInt(this.getAttribute('data-idx')));});
  });
}

function buildZaddList(){
  var q=document.getElementById('zadd-search').value.toLowerCase();
  var filtered=DEFAULT_PRODUCTS.filter(function(p){return p.name.toLowerCase().includes(q);});
  var h='';
  filtered.forEach(function(p){
    h+='<button class="product-btn'+(selectedZapasProduct&&selectedZapasProduct.id===p.id?' selected':'')+'" data-id="'+p.id+'">';
    h+='<span class="product-btn-icon">'+p.icon+'</span><span><div class="product-btn-name">'+p.name+'</div><div class="product-btn-unit">'+(p.coefLabel||p.unit)+'</div></span></button>';
  });
  if(!h) h='<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px;">Topilmadi</div>';
  document.getElementById('zadd-list').innerHTML=h;
  document.querySelectorAll('#zadd-list .product-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      selectedZapasProduct=getProd(btn.getAttribute('data-id'));
      buildZaddList();
      document.getElementById('zadd-amount').classList.add('show');
      document.getElementById('zadd-label').textContent=selectedZapasProduct.name+' ('+selectedZapasProduct.unit+', xom)';
      document.getElementById('zadd-unit').textContent=selectedZapasProduct.unit;
      var ci=document.getElementById('zadd-coef');
      if(selectedZapasProduct.coefLabel){ci.style.display='block';ci.textContent='📌 '+selectedZapasProduct.coefLabel;}
      else ci.style.display='none';
      document.getElementById('zadd-input').value='';
      setTimeout(function(){document.getElementById('zadd-input').focus();document.getElementById('zadd-amount').scrollIntoView({behavior:'smooth',block:'end'});},100);
    });
  });
}
function openZaddModal(){
  selectedZapasProduct=null;
  document.getElementById('zadd-search').value='';
  document.getElementById('zadd-input').value='';
  document.getElementById('zadd-amount').classList.remove('show');
  buildZaddList();
  document.getElementById('modal-zadd').classList.add('open');
}
document.getElementById('modal-zadd').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
document.getElementById('zadd-search').addEventListener('input',buildZaddList);
document.getElementById('zadd-cancel').addEventListener('click',function(){document.getElementById('modal-zadd').classList.remove('open');});
document.getElementById('zadd-save').addEventListener('click',function(){
  if(!selectedZapasProduct) return;
  var amt=parseFloat(document.getElementById('zadd-input').value);
  if(!amt||amt<=0){document.getElementById('zadd-input').focus();return;}
  var today=new Date(); today.setHours(0,0,0,0);
  var ex=zapas.find(function(z){return z.productId===selectedZapasProduct.id;});
  if(ex){ex.rawAmount=Math.round((ex.rawAmount+amt)*10)/10;ex.entryDate=today.toISOString();}
  else zapas.push({productId:selectedZapasProduct.id,rawAmount:amt,entryDate:today.toISOString()});
  saveData(); document.getElementById('modal-zadd').classList.remove('open'); render();
  showToast(selectedZapasProduct.name+' qo\'shildi ✓');
});

function openMealSelect(ds,timeKey,currentOvqatId){
  editingMealTime={dateStr:ds,timeKey:timeKey};
  pendingMealChange=null;
  var mt=MEAL_TIMES.find(function(m){return m.key===timeKey;});
  document.getElementById('meal-modal-title').textContent=mt.icon+' '+mt.name;
  document.getElementById('meal-confirm-box').style.display='none';
  document.getElementById('meal-confirm-yes').style.display='none';
  document.getElementById('meal-options').style.display='';
  var h='';
  ovqatlar.forEach(function(o){
    var ings=o.ingredients.map(function(ing){var p=getProd(ing.productId);return p?p.name+' '+getCookedAmount(ing)+p.unit:'';}).join(', ');
    h+='<div class="meal-option'+(currentOvqatId===o.id?' selected':'')+'" data-oid="'+o.id+'">';
    h+='<span class="meal-option-icon">'+o.icon+'</span><span><div class="meal-option-name">'+o.name+'</div><div class="meal-option-items">'+ings+'</div></span></div>';
  });
  document.getElementById('meal-options').innerHTML=h;
  document.getElementById('modal-meal').classList.add('open');
  document.querySelectorAll('.meal-option').forEach(function(el){
    el.addEventListener('click',function(){
      var oid=this.getAttribute('data-oid');
      if(oid===currentOvqatId){document.getElementById('modal-meal').classList.remove('open');return;}
      pendingMealChange=oid;
      var curO=getOvqat(currentOvqatId); var newO=getOvqat(oid);
      var cb=document.getElementById('meal-confirm-box');
      cb.style.display='block';
      cb.textContent=(curO?curO.name:'Tanlanmagan')+' → '+newO.name+". O'zgartirasizmi?";
      document.getElementById('meal-confirm-yes').style.display='flex';
      document.getElementById('meal-options').style.display='none';
    });
  });
}
document.getElementById('modal-meal').addEventListener('click',function(e){if(e.target===this){this.classList.remove('open');document.getElementById('meal-options').style.display='';}});
document.getElementById('meal-cancel').addEventListener('click',function(){document.getElementById('modal-meal').classList.remove('open');document.getElementById('meal-options').style.display='';pendingMealChange=null;});
document.getElementById('meal-confirm-yes').addEventListener('click',function(){
  if(!pendingMealChange||!editingMealTime) return;
  var ds=editingMealTime.dateStr; var tk=editingMealTime.timeKey;
  if(!dayPlans[ds]) dayPlans[ds]=JSON.parse(JSON.stringify(DEFAULT_DAY_PLAN));
  dayPlans[ds][tk]=pendingMealChange;
  saveData(); document.getElementById('modal-meal').classList.remove('open');
  document.getElementById('meal-options').style.display='';
  pendingMealChange=null; render(); showToast('Saqlandi ✓');
});

var ovqatSelectedEmoji='🍲';
var OVQAT_EMOJIS=['🍲','🥘','🍜','🥗','🍳','🥩','🍖','🫕','🥣','🍱','🫔','🥙'];
function buildOvqatEmoji(){
  var h='';
  OVQAT_EMOJIS.forEach(function(e){
    h+='<button style="width:40px;height:40px;border:2px solid '+(e===ovqatSelectedEmoji?'var(--accent)':'transparent')+';background:'+(e===ovqatSelectedEmoji?'#e8f0e0':'var(--bg)')+';border-radius:8px;font-size:22px;cursor:pointer;" data-emoji="'+e+'">'+e+'</button>';
  });
  document.getElementById('ovqat-emoji-grid').innerHTML=h;
  document.querySelectorAll('#ovqat-emoji-grid button').forEach(function(btn){
    btn.addEventListener('click',function(){ovqatSelectedEmoji=this.getAttribute('data-emoji');buildOvqatEmoji();});
  });
}
function renderTempIngs(){
  var h='';
  tempIngredients.forEach(function(ing,i){
    var prod=getProd(ing.productId); if(!prod) return;
    var raw=getRawNeeded(ing); var cooked=getCookedAmount(ing);
    var label=prod.coef!==1?raw+'g xom → '+cooked+'g pishgan':raw+prod.unit;
    h+='<div class="ing-row"><span class="ing-name">'+prod.icon+' '+prod.name+'</span><span class="ing-amount">'+label+'</span><button class="ing-del" data-iidx="'+i+'">×</button></div>';
  });
  document.getElementById('ovqat-ings').innerHTML=h;
  document.querySelectorAll('.ing-del').forEach(function(btn){
    btn.addEventListener('click',function(){tempIngredients.splice(parseInt(this.getAttribute('data-iidx')),1);renderTempIngs();});
  });
}
function openOvqatModal(oid){
  editingOvqatId=oid;
  if(oid){
    var o=getOvqat(oid);
    document.getElementById('ovqat-modal-title').textContent='Tahrir';
    document.getElementById('ovqat-name').value=o.name;
    ovqatSelectedEmoji=o.icon;
    tempIngredients=JSON.parse(JSON.stringify(o.ingredients));
    document.getElementById('ovqat-del').style.display='flex';
  } else {
    document.getElementById('ovqat-modal-title').textContent='Yangi ovqat';
    document.getElementById('ovqat-name').value='';
    ovqatSelectedEmoji='🍲';
    tempIngredients=[];
    document.getElementById('ovqat-del').style.display='none';
  }
  buildOvqatEmoji(); renderTempIngs();
  document.getElementById('modal-ovqat').classList.add('open');
}
document.getElementById('modal-ovqat').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
document.getElementById('ovqat-cancel').addEventListener('click',function(){document.getElementById('modal-ovqat').classList.remove('open');});
document.getElementById('ovqat-add-ing').addEventListener('click',openIngModal);
document.getElementById('ovqat-save').addEventListener('click',function(){
  var name=document.getElementById('ovqat-name').value.trim();
  if(!name){document.getElementById('ovqat-name').focus();return;}
  if(editingOvqatId){
    var o=getOvqat(editingOvqatId);
    o.name=name;o.icon=ovqatSelectedEmoji;o.ingredients=JSON.parse(JSON.stringify(tempIngredients));
  } else {
    ovqatlar.push({id:'ovqat_'+Date.now(),name:name,icon:ovqatSelectedEmoji,ingredients:JSON.parse(JSON.stringify(tempIngredients))});
  }
  saveData(); document.getElementById('modal-ovqat').classList.remove('open'); render(); showToast('Saqlandi ✓');
});
document.getElementById('ovqat-del').addEventListener('click',function(){
  if(!confirm("O'chirishni tasdiqlaysizmi?")) return;
  ovqatlar=ovqatlar.filter(function(o){return o.id!==editingOvqatId;});
  saveData(); document.getElementById('modal-ovqat').classList.remove('open'); render(); showToast("O'chirildi");
});

// =================== ING MODAL ===================
function buildIngList(){
  var q=document.getElementById('ing-search').value.toLowerCase();
  var filtered=DEFAULT_PRODUCTS.filter(function(p){return p.name.toLowerCase().includes(q);});
  var h='';
  filtered.forEach(function(p){
    h+='<button class="product-btn'+(ingSelectedProduct&&ingSelectedProduct.id===p.id?' selected':'')+'" data-id="'+p.id+'">';
    h+='<span class="product-btn-icon">'+p.icon+'</span><span><div class="product-btn-name">'+p.name+'</div><div class="product-btn-unit">'+p.unit+(p.coefLabel?' · '+p.coefLabel:'')+'</div></span></button>';
  });
  document.getElementById('ing-list').innerHTML=h;
  document.querySelectorAll('#ing-list .product-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      ingSelectedProduct=getProd(btn.getAttribute('data-id'));
      buildIngList();
      document.getElementById('ing-amount').classList.add('show');
      document.getElementById('ing-label').textContent=ingSelectedProduct.name+' (xom, '+ingSelectedProduct.unit+')';
      document.getElementById('ing-unit').textContent=ingSelectedProduct.unit;
      var ci=document.getElementById('ing-coef-info');
      if(ingSelectedProduct.coefLabel){ci.style.display='block';ci.textContent='📌 '+ingSelectedProduct.coefLabel;}
      else ci.style.display='none';
      document.getElementById('ing-input').value='';
      setTimeout(function(){document.getElementById('ing-input').focus();document.getElementById('ing-amount').scrollIntoView({behavior:'smooth',block:'end'});},100);
    });
  });
}
function openIngModal(){
  ingSelectedProduct=null;
  document.getElementById('ing-search').value='';
  document.getElementById('ing-input').value='';
  document.getElementById('ing-amount').classList.remove('show');
  buildIngList();
  document.getElementById('modal-ing').classList.add('open');
}
document.getElementById('modal-ing').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
document.getElementById('ing-search').addEventListener('input',buildIngList);
document.getElementById('ing-cancel').addEventListener('click',function(){document.getElementById('modal-ing').classList.remove('open');});
document.getElementById('ing-save').addEventListener('click',function(){
  if(!ingSelectedProduct) return;
  var rawAmt=parseFloat(document.getElementById('ing-input').value);
  if(!rawAmt||rawAmt<=0){document.getElementById('ing-input').focus();return;}
  var prod=ingSelectedProduct;
  var cookedAmt=prod.coef!==1?Math.round(rawAmt*prod.coef*10)/10:rawAmt;
  var ex=tempIngredients.find(function(i){return i.productId===prod.id;});
  if(ex){ex.rawAmount=rawAmt;ex.cookedAmount=cookedAmt;}
  else tempIngredients.push({productId:prod.id,rawAmount:rawAmt,cookedAmount:cookedAmt});
  document.getElementById('modal-ing').classList.remove('open');
  renderTempIngs();
});

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
if(window.Telegram&&window.Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
loadData(); render();
</script>
