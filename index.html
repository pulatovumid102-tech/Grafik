<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umatizim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f0f3ee;
    --bg2: #ffffff;
    --bg3: #e2e8de;
    --accent: #558237;
    --accent2: #a4b83f;
    --dark: #1e5927;
    --mid: #7a9669;
    --light: #a9b7a3;
    --lightest: #dadfe2;
    --text: #1e2e1a;
    --text2: #558237;
    --text3: #7a9669;
    --danger: #c0392b;
    --radius: 14px;
    --radius-sm: 8px;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding-bottom: 40px; }

  .header { background: var(--bg2); padding: 16px 20px; border-bottom: 1px solid var(--bg3); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .back-btn { width: 32px; height: 32px; background: var(--bg3); border: none; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .logo { width: 36px; height: 36px; background: var(--dark); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .header-title { font-size: 17px; font-weight: 600; color: var(--dark); }
  .header-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }
  .btn-add { width: 36px; height: 36px; background: var(--accent); border: none; border-radius: 10px; color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }

  /* BREADCRUMB */
  .breadcrumb { padding: 10px 16px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text3); overflow-x: auto; white-space: nowrap; background: var(--bg2); border-bottom: 1px solid var(--bg3); }
  .breadcrumb span { cursor: pointer; }
  .breadcrumb span:hover { color: var(--accent); }
  .breadcrumb-sep { color: var(--light); }

  .main { padding: 20px 16px; }
  .page-title { font-size: 13px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; font-weight: 500; }

  .sections-list { display: flex; flex-direction: column; gap: 10px; }
  .section-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: box-shadow 0.15s; }
  .section-card:active { box-shadow: 0 2px 12px rgba(85,130,55,0.15); }
  .drag-handle { color: var(--light); font-size: 16px; cursor: grab; padding: 2px 4px; flex-shrink: 0; }
  .section-icon { width: 44px; height: 44px; background: var(--bg3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .section-info { flex: 1; min-width: 0; }
  .section-name { font-size: 15px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .section-count { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .section-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .btn-icon { width: 30px; height: 30px; border: 1px solid var(--bg3); background: var(--bg3); border-radius: var(--radius-sm); color: var(--text3); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-icon.danger { color: var(--danger); }
  .section-arrow { color: var(--light); font-size: 20px; font-weight: 300; }
  .badge-inactive { font-size: 11px; background: var(--lightest); color: var(--text3); padding: 2px 8px; border-radius: 20px; margin-top: 3px; display: inline-block; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; margin-bottom: 6px; color: var(--text2); }
  .empty-sub { font-size: 13px; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border-radius: var(--radius) var(--radius) 0 0; padding: 24px 20px 40px; width: 100%; max-width: 500px; border-top: 2px solid var(--accent2); }
  .modal-handle { width: 36px; height: 4px; background: var(--bg3); border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; color: var(--text3); margin-bottom: 6px; display: block; font-weight: 500; }
  .form-input { width: 100%; background: var(--bg); border: 1px solid var(--bg3); border-radius: var(--radius-sm); padding: 12px 14px; color: var(--text); font-size: 15px; outline: none; }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--light); }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 8px; }
  .emoji-btn { width: 100%; aspect-ratio: 1; background: var(--bg); border: 2px solid transparent; border-radius: var(--radius-sm); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .emoji-btn.selected { border-color: var(--accent); background: #e8f0e0; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--bg3); margin-top: 4px; }
  .toggle-label { font-size: 15px; color: var(--text2); }
  .toggle { width: 48px; height: 26px; background: var(--light); border-radius: 13px; border: none; cursor: pointer; position: relative; transition: background 0.2s; flex-shrink: 0; }
  .toggle.on { background: var(--accent); }
  .toggle::after { content: ''; position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: left 0.2s; }
  .toggle.on::after { left: 25px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
  .btn-cancel { flex: 1; padding: 14px; background: var(--bg3); border: none; border-radius: var(--radius-sm); color: var(--text3); font-size: 15px; cursor: pointer; }
  .btn-save { flex: 2; padding: 14px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: white; font-size: 15px; font-weight: 600; cursor: pointer; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 500; z-index: 300; transition: transform 0.25s; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
  <!-- header -->
  <div class="header" id="header">
    <div class="header-left" id="header-left"></div>
    <button class="btn-add" id="btn-add">+</button>
  </div>
  <!-- breadcrumb -->
  <div class="breadcrumb" id="breadcrumb" style="display:none"></div>
  <!-- main -->
  <div class="main">
    <div class="page-title" id="page-title">Бўлимлар</div>
    <div id="sections-list" class="sections-list"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Янги бўлим</div>
    <div class="form-group">
      <label class="form-label">Номи</label>
      <input class="form-input" id="input-name" type="text" placeholder="Масалан: Соғлиқ" maxlength="30">
    </div>
    <div class="form-group">
      <label class="form-label">Белги</label>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Фаол</span>
      <button class="toggle on" id="toggle-active"></button>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="btn-cancel">Бекор</button>
      <button class="btn-save" id="btn-save">Сақлаш</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var EMOJIS = ['💚','🏋️','🥗','🏃','💪','🧘','🍎','🥦','🏊','⚽','🎯','📋','📦','🛒','💊','🩺','🧠','❤️','🔥','⚡','🌿','🌱','🥩','🍳','💧','😴','📊','🏆'];

// Data structure: { id, name, icon, is_active, children: [] }
var db = { root: [] };
var nextId = 1;

// Navigation stack: array of { id, name, icon } — null means root
var navStack = [];
var editingId = null;
var selectedEmoji = '💚';
var isActive = true;
var dragSrc = null;

function loadData() {
  try {
    var raw = localStorage.getItem('umatizim_v2');
    if (raw) { var p = JSON.parse(raw); db = p.db || { root: [] }; nextId = p.nextId || 1; }
  } catch(e) { db = { root: [] }; nextId = 1; }
}

function saveData() {
  localStorage.setItem('umatizim_v2', JSON.stringify({ db: db, nextId: nextId }));
}

// Get current sections array based on navStack
function getCurrentList() {
  if (!navStack.length) return db.root;
  return findNode(db.root, navStack[navStack.length - 1].id).children;
}

function findNode(list, id) {
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) return list[i];
    if (list[i].children && list[i].children.length) {
      var found = findNode(list[i].children, id);
      if (found) return found;
    }
  }
  return null;
}

function countChildren(node) {
  return (node.children && node.children.length) ? node.children.length : 0;
}

// RENDER
function render() {
  renderHeader();
  renderBreadcrumb();
  renderList();
}

function renderHeader() {
  var left = document.getElementById('header-left');
  if (!navStack.length) {
    left.innerHTML = '<div class="logo">🌿</div><div><div class="header-title">Umatizim</div><div class="header-sub">Соғлиқ ва спорт</div></div>';
  } else {
    var cur = navStack[navStack.length - 1];
    left.innerHTML = '<button class="back-btn" id="btn-back">←</button><div><div class="header-title">' + cur.icon + ' ' + cur.name + '</div></div>';
    document.getElementById('btn-back').addEventListener('click', goBack);
  }
  document.getElementById('page-title').textContent = navStack.length ? 'Бўлимлар' : 'Бўлимлар';
}

function renderBreadcrumb() {
  var bc = document.getElementById('breadcrumb');
  if (!navStack.length) { bc.style.display = 'none'; return; }
  bc.style.display = 'flex';
  var html = '<span data-idx="-1">🏠 Бош</span>';
  for (var i = 0; i < navStack.length; i++) {
    html += '<span class="breadcrumb-sep"> › </span>';
    html += '<span data-idx="' + i + '">' + navStack[i].icon + ' ' + navStack[i].name + '</span>';
  }
  bc.innerHTML = html;
  bc.querySelectorAll('[data-idx]').forEach(function(el) {
    el.addEventListener('click', function() {
      var idx = parseInt(this.getAttribute('data-idx'));
      if (idx === -1) { navStack = []; }
      else { navStack = navStack.slice(0, idx + 1); }
      render();
    });
  });
}

function renderList() {
  var list = document.getElementById('sections-list');
  var items = getCurrentList();
  if (!items || !items.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🌿</div><div class="empty-text">Ҳали бўлим йўқ</div><div class="empty-sub">+ тугмасини босиб қўшинг</div></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var s = items[i];
    var cnt = countChildren(s);
    html += '<div class="section-card" id="card-' + i + '" draggable="true">';
    html += '<div class="drag-handle">⋮⋮</div>';
    html += '<div class="section-icon">' + s.icon + '</div>';
    html += '<div class="section-info"><div class="section-name">' + s.name + '</div>';
    if (cnt > 0) html += '<div class="section-count">' + cnt + ' та бўлим</div>';
    if (!s.is_active) html += '<span class="badge-inactive">Ўчирилган</span>';
    html += '</div>';
    html += '<div class="section-right">';
    html += '<button class="btn-icon" data-edit="' + i + '">✏️</button>';
    html += '<button class="btn-icon danger" data-del="' + i + '">🗑️</button>';
    html += '<span class="section-arrow">›</span>';
    html += '</div></div>';
  }
  list.innerHTML = html;

  for (var j = 0; j < items.length; j++) {
    (function(idx) {
      var card = document.getElementById('card-' + idx);
      var items2 = getCurrentList();
      card.addEventListener('click', function() { enterSection(items2[idx]); });
      card.querySelector('[data-edit]').addEventListener('click', function(e) { e.stopPropagation(); openEdit(idx); });
      card.querySelector('[data-del]').addEventListener('click', function(e) { e.stopPropagation(); deleteSection(idx); });
      card.addEventListener('dragstart', function() { dragSrc = idx; this.style.opacity = '0.5'; });
      card.addEventListener('dragend', function() { this.style.opacity = '1'; document.querySelectorAll('.section-card').forEach(function(c) { c.style.borderColor = ''; }); });
      card.addEventListener('dragover', function(e) { e.preventDefault(); this.style.borderColor = '#558237'; });
      card.addEventListener('dragleave', function() { this.style.borderColor = ''; });
      card.addEventListener('drop', function(e) {
        e.preventDefault(); this.style.borderColor = '';
        if (dragSrc !== null && dragSrc !== idx) {
          var cur = getCurrentList();
          var moved = cur.splice(dragSrc, 1)[0];
          cur.splice(idx, 0, moved);
          saveData(); render(); showToast('Ўрин сақланди ✓');
        }
        dragSrc = null;
      });
    })(j);
  }
}

function enterSection(s) {
  navStack.push({ id: s.id, name: s.name, icon: s.icon });
  render();
}

function goBack() {
  navStack.pop();
  render();
}

// MODAL
function buildEmojiGrid() {
  var html = '';
  for (var i = 0; i < EMOJIS.length; i++) {
    var e = EMOJIS[i];
    html += '<button class="emoji-btn' + (e === selectedEmoji ? ' selected' : '') + '" data-emoji="' + e + '">' + e + '</button>';
  }
  document.getElementById('emoji-grid').innerHTML = html;
  document.querySelectorAll('.emoji-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      selectedEmoji = this.getAttribute('data-emoji');
      document.querySelectorAll('.emoji-btn').forEach(function(b) { b.classList.remove('selected'); });
      this.classList.add('selected');
    });
  });
}

function openModal() {
  editingId = null; selectedEmoji = '💚'; isActive = true;
  document.getElementById('modal-title').textContent = 'Янги бўлим';
  document.getElementById('input-name').value = '';
  document.getElementById('toggle-active').className = 'toggle on';
  buildEmojiGrid();
  document.getElementById('modal').classList.add('open');
  setTimeout(function() { document.getElementById('input-name').focus(); }, 150);
}

function openEdit(idx) {
  var s = getCurrentList()[idx];
  editingId = idx; selectedEmoji = s.icon; isActive = s.is_active;
  document.getElementById('modal-title').textContent = 'Таҳрир';
  document.getElementById('input-name').value = s.name;
  document.getElementById('toggle-active').className = 'toggle' + (isActive ? ' on' : '');
  buildEmojiGrid();
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function deleteSection(idx) {
  if (!confirm('Ўчиришни тасдиқлайсизми?')) return;
  getCurrentList().splice(idx, 1);
  saveData(); render(); showToast('Ўчирилди');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

document.getElementById('btn-add').addEventListener('click', openModal);
document.getElementById('btn-cancel').addEventListener('click', closeModal);
document.getElementById('toggle-active').addEventListener('click', function() {
  isActive = !isActive;
  this.className = 'toggle' + (isActive ? ' on' : '');
});

document.getElementById('btn-save').addEventListener('click', function() {
  var name = document.getElementById('input-name').value.trim();
  if (!name) { document.getElementById('input-name').focus(); return; }
  var cur = getCurrentList();
  if (editingId !== null) {
    cur[editingId].name = name;
    cur[editingId].icon = selectedEmoji;
    cur[editingId].is_active = isActive;
    if (navStack.length && navStack[navStack.length-1].id === cur[editingId].id) {
      navStack[navStack.length-1].name = name;
      navStack[navStack.length-1].icon = selectedEmoji;
    }
    showToast('Сақланди ✓');
  } else {
    cur.push({ id: nextId++, name: name, icon: selectedEmoji, is_active: isActive, children: [] });
    showToast('Қўшилди ✓');
  }
  saveData(); render(); closeModal();
});

loadData(); render();
</script>
</body>
</html>
