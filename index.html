<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umatizim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f0f3ee;
    --bg2: #ffffff;
    --bg3: #e2e8de;
    --accent: #558237;
    --accent2: #a4b83f;
    --dark: #1e5927;
    --mid: #7a9669;
    --light: #a9b7a3;
    --text: #1e2e1a;
    --text2: #558237;
    --text3: #7a9669;
    --danger: #c0392b;
    --radius: 14px;
    --radius-sm: 8px;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding-bottom: 40px; }

  /* HEADER */
  .header { background: var(--bg2); padding: 16px 20px; border-bottom: 1px solid var(--bg3); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .back-btn { width: 32px; height: 32px; background: var(--bg3); border: none; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .logo { width: 36px; height: 36px; background: var(--dark); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .header-title { font-size: 17px; font-weight: 600; color: var(--dark); }
  .header-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }

  /* BREADCRUMB */
  .breadcrumb { padding: 10px 16px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text3); overflow-x: auto; white-space: nowrap; background: var(--bg2); border-bottom: 1px solid var(--bg3); }
  .breadcrumb span { cursor: pointer; }
  .breadcrumb span:hover { color: var(--accent); }

  .main { padding: 20px 16px; }
  .page-title { font-size: 13px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; font-weight: 500; }

  /* CARDS */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: box-shadow 0.15s; }
  .card:active { box-shadow: 0 2px 12px rgba(85,130,55,0.15); }
  .card-icon { width: 44px; height: 44px; background: var(--bg3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .card-info { flex: 1; }
  .card-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .card-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .card-arrow { color: var(--light); font-size: 20px; }

  /* DAY CARD */
  .day-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 10px; }
  .day-card:active { box-shadow: 0 2px 12px rgba(85,130,55,0.15); }
  .day-date { width: 50px; text-align: center; flex-shrink: 0; }
  .day-date-num { font-size: 22px; font-weight: 600; color: var(--dark); line-height: 1; }
  .day-date-month { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .day-divider { width: 1px; height: 40px; background: var(--bg3); flex-shrink: 0; }
  .day-info { flex: 1; }
  .day-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .day-menu { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .day-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #e8f0e0; color: var(--accent); font-weight: 500; }
  .today-badge { background: var(--accent); color: white; }

  /* MEAL DETAIL */
  .meal-section { margin-bottom: 16px; }
  .meal-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--bg2); border-bottom: 1px solid var(--bg3); }
  .meal-icon-wrap { width: 36px; height: 36px; background: var(--bg3); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .meal-title { font-size: 15px; font-weight: 500; color: var(--text); }
  .meal-items { background: var(--bg2); }
  .meal-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--bg3); }
  .meal-item:last-child { border-bottom: none; }
  .meal-item-name { font-size: 14px; color: var(--text); }
  .meal-item-amount { font-size: 13px; color: var(--text3); background: var(--bg3); padding: 3px 10px; border-radius: 20px; }

  /* NUTRITION SUMMARY */
  .nutrition-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 16px; background: var(--bg2); border-bottom: 1px solid var(--bg3); margin-bottom: 16px; }
  .nut-item { text-align: center; background: var(--bg); border-radius: var(--radius-sm); padding: 10px 4px; }
  .nut-val { font-size: 18px; font-weight: 600; color: var(--dark); }
  .nut-lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* EMPTY */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; margin-bottom: 6px; color: var(--text2); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 500; z-index: 300; transition: transform 0.25s; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// =====================
// DATA
// =====================
var KLASSIKA = {
  name: 'Классика',
  meals: [
    {
      icon: '🌅', name: 'Нонушта',
      items: [{ name: 'Тухум', amount: '5 та' }],
      kcal: 350, protein: 30, fat: 24, carb: 2
    },
    {
      icon: '☀️', name: 'Обед',
      items: [
        { name: 'Товуқ', amount: '220г' },
        { name: 'Гуруч', amount: '250г' },
        { name: 'Брокколи', amount: '1 та' }
      ],
      kcal: 589, protein: 58, fat: 6, carb: 54
    },
    {
      icon: '🌙', name: 'Ужин',
      items: [
        { name: 'Товуқ', amount: '220г' },
        { name: 'Гуруч', amount: '250г' },
        { name: 'Брокколи', amount: '1 та' }
      ],
      kcal: 589, protein: 58, fat: 6, carb: 54
    },
    {
      icon: '🌛', name: 'Кечга',
      items: [{ name: 'Tvorog', amount: '200г' }],
      kcal: 180, protein: 36, fat: 1, carb: 6
    }
  ],
  totalKcal: 1708, totalProtein: 182, totalFat: 37, totalCarb: 116
};

var UZ_DAYS = ['Якшанба','Душанба','Сешанба','Чоршанба','Пайшанба','Жума','Шанба'];
var UZ_MONTHS = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

// Navigation: array of page names
var pageStack = ['home'];
var selectedDate = null;

// =====================
// HELPERS
// =====================
function getDays() {
  var days = [];
  var today = new Date();
  today.setHours(0,0,0,0);
  for (var i = 0; i < 7; i++) {
    var d = new Date(today);
    d.setDate(today.getDate() + i);
    days.push(d);
  }
  return days;
}

function formatDate(d) {
  return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth()+1)).slice(-2);
}

function isToday(d) {
  var t = new Date(); t.setHours(0,0,0,0);
  return d.getTime() === t.getTime();
}

// =====================
// RENDER
// =====================
function render() {
  var page = pageStack[pageStack.length - 1];
  var app = document.getElementById('app');

  if (page === 'home') renderHome(app);
  else if (page === 'soglik') renderSoglik(app);
  else if (page === 'ovqatlanish') renderOvqatlanish(app);
  else if (page === 'ratsion') renderRatsion(app);
  else if (page === 'day') renderDay(app);
  else if (page === 'zapas') renderZapas(app);
  else if (page === 'harid') renderHarid(app);
}

function header(titleHTML, showBack) {
  var backBtn = showBack ? '<button class="back-btn" id="btn-back">←</button>' : '<div class="logo">🌿</div>';
  return '<div class="header"><div class="header-left">' + backBtn +
    '<div><div class="header-title">' + titleHTML + '</div></div></div></div>';
}

function breadcrumb() {
  if (pageStack.length <= 1) return '';
  var labels = { home: '🏠', soglik: '💚 Соғлиқ', ovqatlanish: '🥗 Овқатланиш', ratsion: '📋 Рацион', zapas: '📦 Запас', harid: '🛒 Харид' };
  var html = '<div class="breadcrumb">';
  for (var i = 0; i < pageStack.length - 1; i++) {
    html += '<span data-idx="' + i + '">' + (labels[pageStack[i]] || pageStack[i]) + '</span>';
    html += '<span style="color:var(--light)"> › </span>';
  }
  html += '<span style="color:var(--text2)">' + (labels[pageStack[pageStack.length-1]] || '') + '</span>';
  html += '</div>';
  return html;
}

function renderHome(app) {
  app.innerHTML = header('Umatizim', false) +
  '<div class="main"><div class="page-title">Бўлимлар</div><div class="list">' +
  '<div class="card" id="go-soglik"><div class="card-icon">💚</div><div class="card-info"><div class="card-name">Соғлиқ</div><div class="card-sub">Спорт ва тўғри овқатланиш</div></div><span class="card-arrow">›</span></div>' +
  '</div></div>';
  document.getElementById('go-soglik').addEventListener('click', function() { pageStack.push('soglik'); render(); });
}

function renderSoglik(app) {
  app.innerHTML = header('💚 Соғлиқ', true) + breadcrumb() +
  '<div class="main"><div class="page-title">Бўлимлар</div><div class="list">' +
  '<div class="card" id="go-sport"><div class="card-icon">🏋️</div><div class="card-info"><div class="card-name">Спорт</div><div class="card-sub">Машқлар ва тренировка</div></div><span class="card-arrow">›</span></div>' +
  '<div class="card" id="go-ovqat"><div class="card-icon">🥗</div><div class="card-info"><div class="card-name">Тўғри овқатланиш</div><div class="card-sub">Рацион, запас, харид</div></div><span class="card-arrow">›</span></div>' +
  '</div></div>';
  document.getElementById('go-sport').addEventListener('click', function() { showToast('Яқинда қўшилади'); });
  document.getElementById('go-ovqat').addEventListener('click', function() { pageStack.push('ovqatlanish'); render(); });
  document.getElementById('btn-back').addEventListener('click', goBack);
}

function renderOvqatlanish(app) {
  app.innerHTML = header('🥗 Овқатланиш', true) + breadcrumb() +
  '<div class="main"><div class="page-title">Бўлимлар</div><div class="list">' +
  '<div class="card" id="go-ratsion"><div class="card-icon">📋</div><div class="card-info"><div class="card-name">Кунлик рацион</div><div class="card-sub">7 кунлик овқат режаси</div></div><span class="card-arrow">›</span></div>' +
  '<div class="card" id="go-zapas"><div class="card-icon">📦</div><div class="card-info"><div class="card-name">Запас</div><div class="card-sub">Нима бор, неча кунга</div></div><span class="card-arrow">›</span></div>' +
  '<div class="card" id="go-harid"><div class="card-icon">🛒</div><div class="card-info"><div class="card-name">Харид режаси</div><div class="card-sub">Нима олиш керак</div></div><span class="card-arrow">›</span></div>' +
  '</div></div>';
  document.getElementById('go-ratsion').addEventListener('click', function() { pageStack.push('ratsion'); render(); });
  document.getElementById('go-zapas').addEventListener('click', function() { pageStack.push('zapas'); render(); });
  document.getElementById('go-harid').addEventListener('click', function() { pageStack.push('harid'); render(); });
  document.getElementById('btn-back').addEventListener('click', goBack);
}

function renderRatsion(app) {
  var days = getDays();
  var html = header('📋 Кунлик рацион', true) + breadcrumb() + '<div class="main"><div class="page-title">7 кун</div>';
  for (var i = 0; i < days.length; i++) {
    var d = days[i];
    var today = isToday(d);
    html += '<div class="day-card" data-ts="' + d.getTime() + '">';
    html += '<div class="day-date"><div class="day-date-num">' + d.getDate() + '</div><div class="day-date-month">' + UZ_MONTHS[d.getMonth()] + '</div></div>';
    html += '<div class="day-divider"></div>';
    html += '<div class="day-info"><div class="day-name">' + UZ_DAYS[d.getDay()] + '</div>';
    html += '<div class="day-menu">Классика</div></div>';
    if (today) html += '<span class="day-badge today-badge">Бугун</span>';
    else html += '<span class="day-badge">📋</span>';
    html += '<span class="card-arrow">›</span></div>';
  }
  html += '</div>';
  app.innerHTML = html;
  document.getElementById('btn-back').addEventListener('click', goBack);
  document.querySelectorAll('.day-card').forEach(function(card) {
    card.addEventListener('click', function() {
      selectedDate = new Date(parseInt(this.getAttribute('data-ts')));
      pageStack.push('day');
      render();
    });
  });
}

function renderDay(app) {
  var d = selectedDate;
  var title = ('0'+d.getDate()).slice(-2) + '.' + ('0'+(d.getMonth()+1)).slice(-2) + ' ' + UZ_DAYS[d.getDay()];
  var html = header(title, true) + breadcrumb();

  // Nutrition summary
  html += '<div class="nutrition-bar">';
  html += '<div class="nut-item"><div class="nut-val">' + KLASSIKA.totalKcal + '</div><div class="nut-lbl">Ккал</div></div>';
  html += '<div class="nut-item"><div class="nut-val" style="color:#185FA5">' + KLASSIKA.totalProtein + 'г</div><div class="nut-lbl">Оқсил</div></div>';
  html += '<div class="nut-item"><div class="nut-val" style="color:#854F0B">' + KLASSIKA.totalFat + 'г</div><div class="nut-lbl">Ёғ</div></div>';
  html += '<div class="nut-item"><div class="nut-val" style="color:#3B6D11">' + KLASSIKA.totalCarb + 'г</div><div class="nut-lbl">Кар.</div></div>';
  html += '</div>';

  for (var i = 0; i < KLASSIKA.meals.length; i++) {
    var meal = KLASSIKA.meals[i];
    html += '<div class="meal-section">';
    html += '<div class="meal-header"><div class="meal-icon-wrap">' + meal.icon + '</div><div class="meal-title">' + meal.name + '</div><span style="margin-left:auto;font-size:12px;color:var(--text3)">' + meal.kcal + ' ккал</span></div>';
    html += '<div class="meal-items">';
    for (var j = 0; j < meal.items.length; j++) {
      html += '<div class="meal-item"><span class="meal-item-name">' + meal.items[j].name + '</span><span class="meal-item-amount">' + meal.items[j].amount + '</span></div>';
    }
    html += '</div></div>';
  }

  app.innerHTML = html;
  document.getElementById('btn-back').addEventListener('click', goBack);
}

function renderZapas(app) {
  app.innerHTML = header('📦 Запас', true) + breadcrumb() +
  '<div class="main"><div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">Яқинда қўшилади</div></div></div>';
  document.getElementById('btn-back').addEventListener('click', goBack);
}

function renderHarid(app) {
  app.innerHTML = header('🛒 Харид режаси', true) + breadcrumb() +
  '<div class="main"><div class="empty-state"><div class="empty-icon">🛒</div><div class="empty-text">Яқинда қўшилади</div></div></div>';
  document.getElementById('btn-back').addEventListener('click', goBack);
}

function goBack() {
  pageStack.pop();
  render();
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

render();
</script>
</body>
</html>
